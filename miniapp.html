<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>وانتا | مینی‌اپ</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0B0C10;
      --bg2:       #111318;
      --bg3:       #1A1B22;
      --gold:      #C5A059;
      --gold-dim:  #8a6f3a;
      --gold-glow: rgba(197,160,89,0.15);
      --text:      #D4D5D8;
      --text-dim:  #7a7b80;
      --border:    rgba(197,160,89,0.18);
      --green:     #4caf50;
      --red:       #ef5350;
      --blue:      #42a5f5;
      --radius:    12px;
      --nav-h:     60px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 14px;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      min-height: 52px;
    }
    .topbar-logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, #F3A511 0%, #C5A059 60%, #F3A511 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 2px;
    }
    .topbar-sub {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 1px;
    }
    .topbar-pin-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--gold);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 12px;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      transition: all .2s;
    }
    .topbar-pin-btn:hover { background: var(--gold); color: #000; }

    /* ── PAGES ── */
    .pages {
      flex: 1;
      overflow: hidden;
      position: relative;
    }
    .page {
      position: absolute;
      inset: 0;
      overflow-y: auto;
      padding: 14px 14px calc(var(--nav-h) + 14px);
      display: none;
      -webkit-overflow-scrolling: touch;
    }
    .page.active { display: block; }

    /* ── BOTTOM NAV ── */
    .nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--bg2);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
    }
    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      cursor: pointer;
      transition: all .2s;
      position: relative;
    }
    .nav-item .icon { font-size: 20px; transition: all .2s; }
    .nav-item .label { font-size: 10px; color: var(--text-dim); transition: all .2s; }
    .nav-item.active .icon { transform: scale(1.15); }
    .nav-item.active .label { color: var(--gold); }
    .nav-item::after {
      content: '';
      position: absolute;
      bottom: 0; left: 25%; right: 25%;
      height: 2px;
      background: var(--gold);
      border-radius: 2px 2px 0 0;
      transform: scaleX(0);
      transition: transform .2s;
    }
    .nav-item.active::after { transform: scaleX(1); }
    .badge {
      position: absolute;
      top: 6px; right: 20%;
      background: var(--red);
      color: #fff;
      font-size: 9px;
      width: 16px; height: 16px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700;
    }

    /* ── SECTION HEADERS ── */
    .section-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    /* ── SEARCH BAR ── */
    .search-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }
    .search-input {
      flex: 1;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 13px;
      padding: 9px 14px;
      outline: none;
      transition: border .2s;
    }
    .search-input::placeholder { color: var(--text-dim); }
    .search-input:focus { border-color: var(--gold); }
    .filter-btn {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--gold);
      font-size: 18px;
      width: 40px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
    }
    .filter-btn:hover { background: var(--gold-glow); }

    /* ── FILTER CHIPS ── */
    .chips {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
    }
    .chip.active, .chip:hover { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 700; }

    /* ── PROPERTY CARD ── */
    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: all .2s;
      position: relative;
    }
    .card:hover { border-color: var(--gold-dim); box-shadow: 0 4px 20px var(--gold-glow); transform: translateY(-1px); }
    .card-top {
      padding: 12px 14px 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .card-id { font-size: 10px; color: var(--text-dim); }
    .card-type-badge {
      font-size: 10px;
      padding: 2px 9px;
      border-radius: 10px;
      font-weight: 700;
    }
    .badge-forsale { background: rgba(197,160,89,.2); color: var(--gold); }
    .badge-rent { background: rgba(66,165,245,.18); color: var(--blue); }
    .badge-hot { background: rgba(239,83,80,.2); color: var(--red); }
    .card-title {
      font-size: 15px;
      font-weight: 700;
      color: #eee;
      padding: 0 14px 6px;
    }
    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 14px 10px;
    }
    .meta-pill {
      background: var(--bg3);
      color: var(--text-dim);
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .meta-pill span { color: var(--text); font-weight: 500; }
    .card-price {
      border-top: 1px solid var(--border);
      padding: 10px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .price-main {
      font-size: 15px;
      font-weight: 700;
      color: var(--gold);
    }
    .price-sub { font-size: 11px; color: var(--text-dim); }
    .card-actions {
      display: flex;
      gap: 8px;
      padding: 0 14px 12px;
    }
    .btn {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all .2s;
    }
    .btn-gold { background: var(--gold); color: #000; }
    .btn-gold:hover { background: #F3A511; }
    .btn-ghost { background: var(--bg3); color: var(--gold); border: 1px solid var(--border); }
    .btn-ghost:hover { background: var(--gold-glow); }
    .hot-ribbon {
      position: absolute;
      top: 0; left: 0;
      background: var(--red);
      color: #fff;
      font-size: 9px;
      font-weight: 700;
      padding: 3px 10px;
      border-radius: 0 0 10px 0;
    }

    /* ── STATS BAR ── */
    .stats-bar {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      text-align: center;
    }
    .stat-num {
      font-size: 22px;
      font-weight: 700;
      color: var(--gold);
    }
    .stat-label { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

    /* ── LEAD ROW ── */
    .lead-row {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
      transition: all .2s;
    }
    .lead-row:hover { border-color: var(--gold-dim); }
    .lead-avatar {
      width: 40px; height: 40px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      flex-shrink: 0;
    }
    .avatar-hot { background: rgba(239,83,80,.2); }
    .avatar-warm { background: rgba(255,167,38,.2); }
    .avatar-cold { background: rgba(97,97,97,.2); }
    .lead-info { flex: 1; min-width: 0; }
    .lead-name { font-weight: 600; color: #eee; font-size: 13px; }
    .lead-detail { font-size: 11px; color: var(--text-dim); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lead-badges { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .score-badge {
      font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 8px;
    }
    .score-hot { background: rgba(239,83,80,.2); color: var(--red); }
    .score-warm { background: rgba(255,167,38,.2); color: #FFA726; }
    .score-cold { background: rgba(97,97,97,.2); color: #aaa; }
    .lead-time { font-size: 10px; color: var(--text-dim); }

    /* ── FILING FORM ── */
    .form-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 14px;
    }
    .form-row { margin-bottom: 12px; }
    .form-label { font-size: 11px; color: var(--gold); margin-bottom: 5px; display: block; letter-spacing: .5px; }
    .form-input, .form-select {
      width: 100%;
      background: var(--bg3);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 13px;
      padding: 9px 12px;
      outline: none;
      transition: border .2s;
    }
    .form-input:focus, .form-select:focus { border-color: var(--gold); }
    .form-select { appearance: none; cursor: pointer; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn-submit {
      width: 100%;
      background: linear-gradient(135deg, #F3A511, #C5A059);
      color: #000;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 12px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .2s;
      margin-top: 4px;
    }
    .btn-submit:hover { opacity: .9; transform: translateY(-1px); }
    .btn-submit:active { transform: translateY(0); }

    /* ── LOCK SCREEN ── */
    .lock-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 300px;
      padding: 24px;
      text-align: center;
    }
    .lock-icon { font-size: 52px; margin-bottom: 16px; opacity: .7; }
    .lock-title { font-size: 17px; font-weight: 700; color: #eee; margin-bottom: 6px; }
    .lock-sub { font-size: 12px; color: var(--text-dim); margin-bottom: 24px; line-height: 1.7; }
    .pin-dots { display: flex; gap: 10px; margin-bottom: 24px; justify-content: center; }
    .pin-dot {
      width: 14px; height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gold-dim);
      background: transparent;
      transition: all .2s;
    }
    .pin-dot.filled { background: var(--gold); border-color: var(--gold); }
    .pin-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; max-width: 220px; }
    .pin-key {
      background: var(--bg3);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 18px;
      font-weight: 500;
      padding: 14px;
      border-radius: var(--radius);
      cursor: pointer;
      transition: all .15s;
      text-align: center;
    }
    .pin-key:active { background: var(--gold-glow); border-color: var(--gold); transform: scale(.95); }
    .pin-key.delete { color: var(--red); font-size: 14px; }
    .pin-error { color: var(--red); font-size: 12px; margin-top: 10px; min-height: 18px; }

    /* ── MODAL ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 200;
      display: none;
      align-items: flex-end;
      justify-content: center;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--radius) var(--radius) 0 0;
      width: 100%;
      max-width: 480px;
      padding: 20px 18px;
      max-height: 85dvh;
      overflow-y: auto;
      animation: slideUp .3s ease;
    }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 36px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 16px; }
    .modal-title { font-size: 16px; font-weight: 700; color: #eee; margin-bottom: 14px; }
    .detail-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--bg3); }
    .detail-key { color: var(--text-dim); font-size: 12px; }
    .detail-val { color: var(--text); font-size: 12px; font-weight: 500; text-align: left; }
    .btn-chat {
      width: 100%;
      background: linear-gradient(135deg, #F3A511, #C5A059);
      color: #000;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 14px;
      font-weight: 700;
      padding: 13px;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* ── EMPTY STATE ── */
    .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); }
    .empty-icon { font-size: 40px; margin-bottom: 10px; opacity: .5; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      top: 60px; left: 50%; transform: translateX(-50%);
      background: var(--bg3);
      border: 1px solid var(--gold);
      color: var(--gold);
      font-size: 13px;
      padding: 10px 20px;
      border-radius: 20px;
      z-index: 300;
      opacity: 0;
      transition: opacity .3s;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    /* ── SCROLL BAR ── */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="topbar-logo">VANTA</div>
    <div class="topbar-sub">پیام‌رسان بله</div>
  </div>
  <button class="topbar-pin-btn" onclick="showAdminHint()">🔐 ورود مشاور</button>
</div>

<!-- PAGES -->
<div class="pages">

  <!-- ─────── PAGE 1: CATALOG ─────── -->
  <div class="page active" id="page-catalog">
    <div class="search-bar">
      <input class="search-input" type="search" placeholder="جستجو در ملک‌ها..." id="search-input" oninput="filterCards()">
      <button class="filter-btn" onclick="toggleFilters()">⚙️</button>
    </div>

    <div class="chips" id="chips">
      <button class="chip active" data-filter="all" onclick="setFilter(this,'all')">همه</button>
      <button class="chip" data-filter="فروش" onclick="setFilter(this,'فروش')">فروش</button>
      <button class="chip" data-filter="اجاره" onclick="setFilter(this,'اجاره')">اجاره</button>
      <button class="chip" data-filter="آپارتمان" onclick="setFilter(this,'آپارتمان')">آپارتمان</button>
      <button class="chip" data-filter="ویلا" onclick="setFilter(this,'ویلا')">ویلا</button>
      <button class="chip" data-filter="تجاری" onclick="setFilter(this,'تجاری')">تجاری</button>
      <button class="chip" data-filter="hot" onclick="setFilter(this,'hot')">🔥 فرصت ویژه</button>
    </div>

    <div id="cards-container"></div>
  </div>

  <!-- ─────── PAGE 2: FILING ─────── -->
  <div class="page" id="page-filing">
    <div id="filing-lock">
      <div class="lock-screen">
        <div class="lock-icon">🗂️</div>
        <div class="lock-title">پنل ثبت فایل</div>
        <div class="lock-sub">این بخش مخصوص مشاورین وانتا است.<br>PIN چهاررقمی خود را وارد کنید.</div>
        <div class="pin-dots" id="filing-dots">
          <div class="pin-dot" id="fd0"></div>
          <div class="pin-dot" id="fd1"></div>
          <div class="pin-dot" id="fd2"></div>
          <div class="pin-dot" id="fd3"></div>
        </div>
        <div class="pin-pad">
          <button class="pin-key" onclick="pinKey('filing',1)">۱</button>
          <button class="pin-key" onclick="pinKey('filing',2)">۲</button>
          <button class="pin-key" onclick="pinKey('filing',3)">۳</button>
          <button class="pin-key" onclick="pinKey('filing',4)">۴</button>
          <button class="pin-key" onclick="pinKey('filing',5)">۵</button>
          <button class="pin-key" onclick="pinKey('filing',6)">۶</button>
          <button class="pin-key" onclick="pinKey('filing',7)">۷</button>
          <button class="pin-key" onclick="pinKey('filing',8)">۸</button>
          <button class="pin-key" onclick="pinKey('filing',9)">۹</button>
          <button class="pin-key" onclick="pinKey('filing','clear')">🗑️</button>
          <button class="pin-key" onclick="pinKey('filing',0)">۰</button>
          <button class="pin-key delete" onclick="pinKey('filing','del')">⌫</button>
        </div>
        <div class="pin-error" id="filing-err"></div>
      </div>
    </div>

    <div id="filing-content" style="display:none">
      <div class="section-title">📥 ثبت فایل جدید</div>
      <div class="form-card">
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">نوع معامله</label>
            <select class="form-select">
              <option>فروش</option><option>اجاره</option><option>رهن</option>
            </select>
          </div>
          <div class="form-row">
            <label class="form-label">نوع ملک</label>
            <select class="form-select">
              <option>آپارتمان</option><option>ویلا</option><option>زمین</option>
              <option>تجاری</option><option>مغازه</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <label class="form-label">آدرس کامل</label>
          <input class="form-input" type="text" placeholder="شیراز.شهرک بهشتی.خیابان...">
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">متراژ (م²)</label>
            <input class="form-input" type="number" placeholder="۱۲۰">
          </div>
          <div class="form-row">
            <label class="form-label">تعداد خواب</label>
            <input class="form-input" type="number" placeholder="۳">
          </div>
        </div>
        <div class="form-grid">
          <div class="form-row">
            <label class="form-label">طبقه</label>
            <input class="form-input" type="number" placeholder="۲">
          </div>
          <div class="form-row">
            <label class="form-label">سال ساخت</label>
            <input class="form-input" type="number" placeholder="۱۴۰۱">
          </div>
        </div>
        <div class="form-row">
          <label class="form-label">قیمت / قیمت متری (تومان)</label>
          <input class="form-input" type="text" placeholder="مثال: ۵،۰۰۰،۰۰۰،۰۰۰">
        </div>
        <div class="form-row">
          <label class="form-label">نام مالک</label>
          <input class="form-input" type="text" placeholder="محرمانه — فقط مشاوران">
        </div>
        <div class="form-row">
          <label class="form-label">شماره مالک</label>
          <input class="form-input" type="tel" placeholder="۰۹۱۲...">
        </div>
        <div class="form-row">
          <label class="form-label">نوع سند</label>
          <select class="form-select">
            <option>شش‌دانگ</option><option>تک‌برگ</option><option>مشاع</option>

function switchPage(page) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));

  document.getElementById('page-' + page).classList.add('active');

function setFilter(el, val) {
  document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeFilter = val;
  filterCards();
}

function filterCards() {
  const q = document.getElementById('search-input').value.trim().toLowerCase();
  const filtered = PROPERTIES.filter(p => {
    const matchFilter =
      activeFilter === "all" ||
      activeFilter === p.type_moameleh ||
      activeFilter === p.type_melk ||
      (activeFilter === "hot" && p.lead_score === "hot");
    const matchSearch = !q || [p.id,p.addr,p.type_melk,p.tozih]
      .join(" ").toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });
  renderCards(filtered);
}

function setLeadFilter(el, val) {
  document.querySelectorAll('#leads-content .chips .chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  activeLeadFilter = val;
  renderLeads();
}

// ══════════════════════════════════════

// ══════════════════════════════════════
function renderCards(list) {

  if (!list.length) {
    container.innerHTML = '<div class="empty"><div class="empty-icon">🔍</div>فایلی پیدا نشد</div>';
    return;
  }
  container.innerHTML = list.map((p, i) => {
    const isSale = p.type_moameleh === "فروش";
    const isHot = p.lead_score === "hot";
    const badgeClass = isHot ? "badge-hot" : (isSale ? "badge-forsale" : "badge-rent");
    const badgeText = isHot ? "🔥 فرصت ویژه" : p.type_moameleh;
    const addr = p.addr.split(".").slice(1).join("، ");
    return `
    <div class="card" onclick="showDetail(${i})">
      ${isHot ? '<div class="hot-ribbon">فرصت ویژه</div>' : ''}
      <div class="card-top">
        <span class="card-id">${p.id}</span>
        <span class="card-type-badge ${badgeClass}">${badgeText}</span>
      </div>
      <div class="card-title">${p.type_melk} ${p.metraj ? '· '+p.metraj+'م²' : ''}</div>
      <div class="card-meta">
        ${p.khab&&p.khab!=="—" ? `<div class="meta-pill">🛏 <span>${p.khab} خواب</span></div>` : ''}
        ${p.tabaqeh&&p.tabaqeh!=="—" ? `<div class="meta-pill">🏢 <span>ط${p.tabaqeh}</span></div>` : ''}
        ${p.sal_sakh ? `<div class="meta-pill">🗓 <span>${p.sal_sakh}</span></div>` : ''}
        ${p.jahat&&p.jahat!=="—" ? `<div class="meta-pill">🧭 <span>${p.jahat}</span></div>` : ''}
        ${addr ? `<div class="meta-pill">📍 <span>${addr}</span></div>` : ''}
        ${p.sanad ? `<div class="meta-pill">📜 <span>${p.sanad}</span></div>` : ''}
      </div>
      <div class="card-price">
        <div>
          <div class="price-main">${formatPrice(p.price1, isSale)}</div>
          ${!isSale ? `<div class="price-sub">ودیعه: ${formatPrice(p.price2, false)}</div>` : ''}
          ${isSale ? `<div class="price-sub">کل: ${formatPrice(p.price2, true)}</div>` : ''}
        </div>
        <div style="color:var(--gold-dim);font-size:18px">›</div>
      </div>
      ${p.tozih ? `<div class="card-actions"><button class="btn btn-gold" onclick="event.stopPropagation();showDetail(${i})">مشاهده جزئیات</button><button class="btn btn-ghost" onclick="event.stopPropagation();startChat()">💬 مشاوره</button></div>` : ''}
    </div>`;
  }).join('');
}

function formatPrice(val, isMeter) {
  if (!val) return "—";
  return val + " ت" + (isMeter ? "/م²" : "");

    <div class="detail-row"><span class="detail-key">سال ساخت</span><span class="detail-val">${prop.sal_sakh}</span></div>
    <div class="detail-row"><span class="detail-key">جهت</span><span class="detail-val">${prop.jahat}</span></div>
    <div class="detail-row"><span class="detail-key">منطقه</span><span class="detail-val">${addr}</span></div>
    <div class="detail-row"><span class="detail-key">سند</span><span class="detail-val">${prop.sanad}</span></div>

// ══════════════════════════════════════
// PIN SYSTEM
// ══════════════════════════════════════
function pinKey(section, key) {
  const state = pinState[section];
  if (key === 'del') { state.pop(); }
  else if (key === 'clear') { pinState[section] = []; }
  else if (state.length < 4) { state.push(key); }
  updateDots(section);
  if (state.length === 4) setTimeout(() => checkPin(section), 150);
}

function updateDots(section) {
  const state = pinState[section];
  const prefix = section === 'filing' ? 'fd' : 'ld';
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById(prefix + i);
    if (dot) dot.classList.toggle('filled', i < state.length);
  }
}

function checkPin(section) {
  const entered = pinState[section].join('');
  const err = document.getElementById(section + '-err');
  if (entered === DEMO_PIN) {
    unlockedSections[section] = true;
    document.getElementById(section + '-lock').style.display = 'none';
    document.getElementById(section + '-content').style.display = 'block';
    if (section === 'leads') renderLeads();
    if (section === 'filing') renderFiled();
    showToast("✅ دسترسی تأیید شد");
  } else {
    err.textContent = "PIN اشتباه است. دوباره تلاش کنید.";
    pinState[section] = [];
    updateDots(section);
    setTimeout(() => err.textContent = '', 2000);
  }
}
