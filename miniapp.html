<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>VANTA</title>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:     #080809;
      --bg1:    #0E0E10;
      --bg2:    #141416;
      --bg3:    #1C1C1F;
      --gold:   #C5A459;
      --gold-d: #8A6E38;
      --gold-g: rgba(197,164,89,.10);
      --text:   #D8D8D4;
      --text2:  #78787A;
      --border: rgba(197,164,89,.14);
      --red:    #C0392B;
      --green:  #27AE60;
      --r:      5px;
      --nav:    56px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── TOPBAR ── */
    .topbar {
      background: var(--bg1);
      border-bottom: 1px solid var(--border);
      padding: 0 16px;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    .logo { font-size: 16px; font-weight: 700; letter-spacing: 4px; color: var(--gold); }
    .logo-sub { font-size: 9px; color: var(--text2); letter-spacing: 2px; margin-top: 1px; }
    .login-btn {
      font-family: 'Vazirmatn', sans-serif;
      font-size: 11px;
      color: var(--gold);
      background: transparent;
      border: 1px solid rgba(197,164,89,.25);
      padding: 5px 14px;
      border-radius: 3px;
      cursor: pointer;
      letter-spacing: .5px;
      transition: background .2s;
    }
    .login-btn:hover { background: var(--gold-g); }

    /* ── PAGES ── */
    .pages { flex: 1; overflow: hidden; position: relative; }
    .page {
      position: absolute; inset: 0;
      overflow-y: auto;
      padding: 14px 14px calc(var(--nav) + 14px);
      display: none;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .page::-webkit-scrollbar { display: none; }
    .page.active { display: block; }

    /* ── BOTTOM NAV ── */
    .nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: var(--nav);
      background: var(--bg1);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
    }
    .ni {
      flex: 1;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 3px;
      cursor: pointer;
      position: relative;
      transition: opacity .2s;
    }
    .ni-icon {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      transition: transform .2s;
    }
    .ni-icon svg { width: 18px; height: 18px; stroke: var(--text2); fill: none; stroke-width: 1.5; transition: stroke .2s; }
    .ni-label { font-size: 9px; letter-spacing: .5px; color: var(--text2); transition: color .2s; }
    .ni.active .ni-icon svg { stroke: var(--gold); }
    .ni.active .ni-label { color: var(--gold); }
    .ni.active .ni-icon { transform: scale(1.1); }
    .ni::before {
      content: '';
      position: absolute; top: 0; left: 20%; right: 20%;
      height: 1px; background: var(--gold);
      transform: scaleX(0); transition: transform .25s;
    }
    .ni.active::before { transform: scaleX(1); }
    .nav-dot {
      position: absolute; top: 9px; right: 18%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--red);
      display: none;
    }

    /* ── SEARCH ── */
    .search-row { display: flex; gap: 8px; margin-bottom: 10px; }
    .search-inp {
      flex: 1;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 13px;
      padding: 9px 13px;
      outline: none;
      transition: border .2s;
    }
    .search-inp::placeholder { color: var(--text2); }
    .search-inp:focus { border-color: var(--gold-d); }

    /* ── CHIPS ── */
    .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; margin-bottom: 12px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 11px;
      padding: 5px 12px;
      border-radius: 2px;
      cursor: pointer;
      white-space: nowrap;
      transition: all .2s;
    }
    .chip.on { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 600; }

    /* ── PROPERTY CARD ── */
    .card {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--r);
      margin-bottom: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color .2s, transform .15s;
      position: relative;
    }
    .card:active { transform: scale(.99); }
    .card:hover { border-color: var(--gold-d); }

    /* photo placeholder */
    .card-ph {
      height: 160px;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .grad-apt  { background: linear-gradient(145deg, #141928 0%, #0C0D14 70%, #080809 100%); }
    .grad-vila { background: linear-gradient(145deg, #121A13 0%, #0C120D 70%, #080809 100%); }
    .grad-land { background: linear-gradient(145deg, #1A1610 0%, #120F0B 70%, #080809 100%); }
    .grad-com  { background: linear-gradient(145deg, #1A1218 0%, #120D10 70%, #080809 100%); }

    /* subtle grid overlay */
    .card-ph::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(197,164,89,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(197,164,89,.05) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    /* bottom fade */
    .card-ph::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 70px;
      background: linear-gradient(transparent, rgba(8,8,9,.92));
    }
    .card-ph-logo {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 4px;
      color: rgba(197,164,89,.08);
      user-select: none;
      z-index: 0;
    }
    .card-ph-overlay {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 8px 12px;
      z-index: 1;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
    }
    .card-ph-id { font-size: 10px; color: rgba(197,164,89,.5); letter-spacing: 1px; }
    .card-badges { display: flex; gap: 5px; }
    .badge {
      font-size: 9px; font-weight: 700;
      padding: 2px 8px; border-radius: 2px;
      letter-spacing: .5px;
    }
    .badge-sale { background: rgba(197,164,89,.18); color: var(--gold); border: 1px solid rgba(197,164,89,.28); }
    .badge-rent { background: rgba(80,130,200,.15); color: #7AA8D8; border: 1px solid rgba(80,130,200,.25); }
    .badge-hot  { background: rgba(192,57,43,.22); color: #E05C4C; border: 1px solid rgba(192,57,43,.32); }

    .card-body { padding: 11px 13px 13px; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 3px; }
    .card-loc { font-size: 11px; color: var(--text2); margin-bottom: 9px; }
    .card-specs { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 8px; }
    .spec { font-size: 11px; color: var(--text2); }
    .spec b { color: var(--text); font-weight: 500; }
    .amenities { display: flex; gap: 10px; margin-bottom: 8px; }
    .amen { font-size: 10px; color: var(--text2); }
    .amen.yes { color: rgba(197,164,89,.65); }
    .card-price-row {
      border-top: 1px solid rgba(197,164,89,.07);
      padding-top: 9px;
      display: flex; justify-content: space-between; align-items: baseline;
    }
    .price-main { font-size: 14px; font-weight: 700; color: var(--gold); }
    .price-lbl { font-size: 10px; color: var(--text2); margin-top: 1px; }
    .price-alt { font-size: 11px; color: var(--text2); text-align: left; }
    .price-alt-num { font-size: 12px; color: var(--gold-d); }

    /* ── LOADING / EMPTY ── */
    .loading {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 64px 0; gap: 14px;
    }
    .spinner {
      width: 26px; height: 26px;
      border: 1.5px solid var(--border);
      border-top-color: var(--gold);
      border-radius: 50%;
      animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-txt { font-size: 11px; color: var(--text2); letter-spacing: .5px; }
    .empty { text-align: center; padding: 60px 20px; }
    .empty-icon { font-size: 32px; margin-bottom: 10px; opacity: .2; }
    .empty-txt { font-size: 12px; color: var(--text2); }

    /* ── SEC TITLE ── */
    .sec {
      font-size: 10px; font-weight: 600;
      color: var(--gold); letter-spacing: 1.5px;
      margin-bottom: 12px;
      display: flex; align-items: center; gap: 10px;
    }
    .sec::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* ── LOCK SCREEN ── */
    .lock {
      display: flex; flex-direction: column;
      align-items: center;
      padding: 52px 24px 24px;
      text-align: center;
    }
    .lock-ring {
      width: 60px; height: 60px;
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 20px;
      background: var(--bg2);
    }
    .lock-ring svg { width: 24px; height: 24px; stroke: var(--gold-d); fill: none; stroke-width: 1.5; }
    .lock-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 6px; }
    .lock-sub {
      font-size: 12px; color: var(--text2);
      line-height: 1.8; margin-bottom: 28px; max-width: 240px;
    }
    .lock-inp {
      width: 100%; max-width: 280px;
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: var(--r);
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 15px;
      padding: 12px 14px;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
      transition: border .2s;
      margin-bottom: 10px;
    }
    .lock-inp:focus { border-color: var(--gold-d); }
    .lock-inp.err { border-color: var(--red); animation: shake .3s; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-7px); }
      75% { transform: translateX(7px); }
    }
    .lock-btn {
      width: 100%; max-width: 280px;
      background: var(--gold);
      color: #000;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 13px; font-weight: 700;
      padding: 11px; border: none;
      border-radius: var(--r);
      cursor: pointer; letter-spacing: .5px;
      transition: opacity .2s;
    }
    .lock-btn:hover { opacity: .9; }
    .lock-err { font-size: 12px; color: var(--red); margin-top: 9px; min-height: 18px; }
    .lock-hint { font-size: 10px; color: var(--text2); margin-top: 12px; opacity: .6; }

    /* ── FORM ── */
    .form-card {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--r);
      padding: 16px;
      margin-bottom: 12px;
    }
    .fsec {
      font-size: 9px; font-weight: 600;
      color: var(--gold-d); letter-spacing: 1.5px;
      margin-bottom: 11px; margin-top: 16px;
      padding-bottom: 6px;
      border-bottom: 1px solid rgba(197,164,89,.08);
    }
    .fsec:first-child { margin-top: 0; }
    .fr { margin-bottom: 9px; }
    .fl { font-size: 10px; color: var(--text2); margin-bottom: 4px; display: block; }
    .fi, .fs {
      width: 100%;
      background: var(--bg2);
      border: 1px solid rgba(197,164,89,.1);
      border-radius: 4px;
      color: var(--text);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 13px;
      padding: 9px 11px;
      outline: none;
      transition: border .2s;
    }
    .fi:focus, .fs:focus { border-color: var(--gold-d); }
    .fi::placeholder { color: var(--text2); font-size: 12px; }
    .fs { appearance: none; cursor: pointer; }
    .fg2 { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
    .fg3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 9px; }

    /* toggles */
    .tg-row { display: flex; gap: 8px; }
    .tg-btn {
      flex: 1; padding: 9px;
      background: var(--bg2);
      border: 1px solid rgba(197,164,89,.1);
      border-radius: 4px;
      color: var(--text2);
      font-family: 'Vazirmatn', sans-serif;
      font-size: 12px;
      cursor: pointer; text-align: center;
      transition: all .2s;
    }
    .tg-btn.on { background: var(--gold-g); border-color: var(--gold-d); color: var(--gold); font-weight: 600; }

    .btn-submit {
      width: 100%; background: var(--gold);
      color: #000;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 14px; font-weight: 700;
      padding: 13px; border: none;
      border-radius: var(--r);
      cursor: pointer; margin-top: 8px;
      letter-spacing: .5px;
      transition: opacity .2s, transform .1s;
    }
    .btn-submit:hover { opacity: .9; }
    .btn-submit:active { transform: scale(.99); }

    /* ── STATS ── */
    .stats {
      display: grid; grid-template-columns: repeat(3,1fr);
      gap: 8px; margin-bottom: 12px;
    }
    .stat {
      background: var(--bg1); border: 1px solid var(--border);
      border-radius: var(--r); padding: 13px 8px; text-align: center;
    }
    .stat-n { font-size: 22px; font-weight: 700; color: var(--gold); line-height: 1; }
    .stat-k { font-size: 10px; color: var(--text2); margin-top: 4px; }

    /* ── LEAD ROW ── */
    .lead {
      background: var(--bg1); border: 1px solid var(--border);
      border-radius: var(--r); padding: 12px 13px;
      margin-bottom: 8px;
      display: flex; align-items: center; gap: 12px;
      cursor: pointer; transition: border-color .2s;
    }
    .lead:hover { border-color: var(--gold-d); }
    .lead-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .d-hot  { background: var(--red); box-shadow: 0 0 6px rgba(192,57,43,.4); }
    .d-warm { background: #D4A843; }
    .d-cold { background: var(--text2); opacity: .4; }
    .lead-body { flex: 1; min-width: 0; }
    .lead-name { font-size: 13px; font-weight: 600; color: var(--text); }
    .lead-detail { font-size: 11px; color: var(--text2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lead-right { text-align: left; flex-shrink: 0; }
    .ls { font-size: 9px; font-weight: 700; padding: 2px 8px; border-radius: 2px; letter-spacing: .3px; }
    .ls-hot  { background: rgba(192,57,43,.18); color: #E05C4C; }
    .ls-warm { background: rgba(212,168,67,.15); color: #D4A843; }
    .ls-cold { background: rgba(100,100,100,.12); color: var(--text2); }
    .lead-time { font-size: 10px; color: var(--text2); margin-top: 4px; }

    /* ── MODAL ── */
    .modal-wrap {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.82);
      z-index: 200; display: none;
      align-items: flex-end; justify-content: center;
    }
    .modal-wrap.open { display: flex; }
    .modal {
      background: var(--bg1);
      border: 1px solid var(--border);
      border-radius: var(--r) var(--r) 0 0;
      width: 100%; max-width: 480px;
      max-height: 88dvh; overflow-y: auto;
      animation: slideup .28s ease;
      scrollbar-width: none;
    }
    .modal::-webkit-scrollbar { display: none; }
    @keyframes slideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
    .modal-handle { width: 30px; height: 3px; background: var(--border); border-radius: 2px; margin: 11px auto 0; }
    .modal-ph {
      height: 190px; margin-top: 11px;
      position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-ph::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(197,164,89,.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(197,164,89,.05) 1px, transparent 1px);
      background-size: 28px 28px;
    }
    .modal-ph::after {
      content: '';
      position: absolute; bottom: 0; left: 0; right: 0;
      height: 100px;
      background: linear-gradient(transparent, rgba(8,8,9,.96));
    }
    .modal-ph-txt {
      position: absolute; bottom: 14px; left: 14px; right: 14px;
      z-index: 1;
      display: flex; justify-content: space-between; align-items: flex-end;
    }
    .modal-ph-logo { font-size: 11px; letter-spacing: 4px; color: rgba(197,164,89,.07); user-select: none; }
    .modal-body { padding: 16px; }
    .modal-title { font-size: 18px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
    .modal-sub { font-size: 12px; color: var(--text2); margin-bottom: 14px; }
    .price-box {
      background: var(--bg2); border: 1px solid var(--border);
      border-radius: var(--r); padding: 13px 14px;
      margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .pb-main { font-size: 20px; font-weight: 700; color: var(--gold); }
    .pb-lbl { font-size: 10px; color: var(--text2); margin-top: 3px; }
    .pb-right { text-align: left; }
    .pb-alt { font-size: 14px; font-weight: 600; color: var(--gold-d); }
    .pb-alt-lbl { font-size: 10px; color: var(--text2); margin-top: 3px; }
    .dtbl { width: 100%; border-collapse: collapse; margin-bottom: 14px; }
    .dtbl td { padding: 9px 0; font-size: 12px; border-bottom: 1px solid rgba(197,164,89,.06); }
    .dtbl td:first-child { color: var(--text2); width: 42%; }
    .dtbl td:last-child { color: var(--text); font-weight: 500; text-align: left; }
    .btn-cta {
      width: 100%; background: var(--gold); color: #000;
      font-family: 'Vazirmatn', sans-serif;
      font-size: 14px; font-weight: 700;
      padding: 14px; border: none;
      border-radius: var(--r); cursor: pointer;
      transition: opacity .2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-cta:hover { opacity: .9; }

    /* ── TOAST ── */
    .toast {
      position: fixed;
      bottom: calc(var(--nav) + 12px); left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: var(--bg2); border: 1px solid var(--border);
      color: var(--text); font-size: 12px;
      padding: 8px 18px; border-radius: 3px;
      z-index: 300; opacity: 0;
      transition: all .28s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

<!-- TOP BAR -->
<div class="topbar">
  <div>
    <div class="logo">VANTA</div>
    <div class="logo-sub">مینی‌اپ</div>
  </div>
  <button class="login-btn" onclick="goPage('filing')">ورود مشاور</button>
</div>

<!-- PAGES -->
<div class="pages">

  <!-- ── CATALOG ── -->
  <div class="page active" id="pg-catalog">
    <div class="search-row">
      <input class="search-inp" id="search-inp" type="search" placeholder="جستجو در فایل‌ها..." oninput="filterCards()">
    </div>
    <div class="chips" id="chips">
      <button class="chip on" onclick="setFilter(this,'all')">همه</button>
      <button class="chip" onclick="setFilter(this,'فروش')">فروش</button>
      <button class="chip" onclick="setFilter(this,'اجاره')">اجاره</button>
      <button class="chip" onclick="setFilter(this,'آپارتمان')">آپارتمان</button>
      <button class="chip" onclick="setFilter(this,'ویلا')">ویلا</button>
      <button class="chip" onclick="setFilter(this,'تجاری')">تجاری</button>
      <button class="chip" onclick="setFilter(this,'hot')">فرصت ویژه</button>
    </div>
    <div id="cards-wrap">
      <div class="loading">
        <div class="spinner"></div>
        <div class="loading-txt">در حال بارگذاری...</div>
      </div>
    </div>
  </div>

  <!-- ── FILING ── -->
  <div class="page" id="pg-filing">
    <div id="filing-lock">
      <div class="lock">
        <div class="lock-ring">
          <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        </div>
        <div class="lock-title">پنل فایلینگ</div>
        <div class="lock-sub">مخصوص مشاران وانتا.<br>کد مشاور خود را وارد کنید.</div>
        <input class="lock-inp" id="filing-inp" type="text"
               placeholder="کد مشاور" autocomplete="off"
               onkeyup="if(event.key==='Enter')checkPin('filing')">
        <button class="lock-btn" onclick="checkPin('filing')">ورود</button>
        <div class="lock-err" id="filing-err"></div>
        <div class="lock-hint">دمو: 1234</div>
      </div>
    </div>
    <div id="filing-content" style="display:none"></div>

<script>
// ── CONFIG ───────────────────────────────────────────────
const FILES_URL = 'https://raw.githubusercontent.com/vandidadhonar-sudo/vanta-filing-bot/db/data/files.json';
const BOT_USERNAME = 'VantaSalesBot';
const ADVISOR_PREFIX = 'hadibakhtzadeh';

// ── BALE INTEGRATION ─────────────────────────────────────
const BaleApp = window.Bale?.WebApp || window.Telegram?.WebApp || null;
if (BaleApp) { BaleApp.ready(); BaleApp.expand(); }

// ── STATE ────────────────────────────────────────────────
let PROPS = [];
let activeFlt = 'all';
let activeLeadFlt = 'all';

// ── LEADS SAMPLE (from SQLite in sales-bot) ──────────────
const LEADS = [
  { name:'محمد رضایی',  budget:'۳ میلیارد',  zone:'زیتون کارمندی', type:'مصرفی',       score:'hot',  time:'۲ ساعت پیش',  sum:'۳ خواب شمالی، پارکینگ ضروری' },
  { name:'علی کریمی',   budget:'بدون سقف',    zone:'الهیه',          type:'سازنده',      score:'hot',  time:'۳ ساعت پیش',  sum:'زمین یا ویلای کلنگی' },
  { name:'حسین نجفی',   budget:'۸ میلیارد',  zone:'سعدیه',          type:'سرمایه‌گذار', score:'hot',  time:'۳۰ دقیقه پیش', sum:'ویلا یا زمین متراژ بالا' },
  { name:'سارا احمدی',  budget:'۱ میلیارد',  zone:'قصردشت',         type:'سرمایه‌گذار', score:'warm', time:'دیروز',        sum:'آپارتمان کوچک، سند مهم' },
  { name:'مریم صادقی',  budget:'۴ میلیارد',  zone:'زند',            type:'مصرفی',       score:'warm', time:'دیروز',        sum:'تجاری یا آپارتمان بزرگ' },
  { name:'رضا طاهری',   budget:'۲ میلیارد',  zone:'قصردشت',         type:'مصرفی',       score:'warm', time:'۲ روز پیش',   sum:'۳ خواب با پارکینگ' },
  { name:'فاطمه موسوی', budget:'۵۰۰ میلیون', zone:'شهرک بهشتی',     type:'مصرفی',       score:'cold', time:'۳ روز پیش',   sum:'اجاره ۲ خواب' },
];

// ── PAGE NAV ─────────────────────────────────────────────
function goPage(p) {
  document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
  document.querySelectorAll('.ni').forEach(x => x.classList.remove('active'));
  document.getElementById('pg-' + p).classList.add('active');
  document.getElementById('ni-' + p).classList.add('active');
}

// ── LOAD PROPERTIES ──────────────────────────────────────
async function loadProperties() {
  try {
    const res = await fetch(FILES_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    PROPS = data.filter(p => p.status === 'فعال');
    renderCards(filterProps());
  } catch (e) {
    PROPS = FALLBACK;
    renderCards(PROPS);
  }
}

// ── FILTER ───────────────────────────────────────────────
function filterProps() {
  const q = (document.getElementById('search-inp')?.value || '').trim().toLowerCase();
  return PROPS.filter(p => {
    const mf = activeFlt === 'all' || activeFlt === p.type_moameleh ||
               activeFlt === p.type_melk || (activeFlt === 'hot' && p.lead_score === 'hot');
    const ms = !q || [p.id,p.addr,p.type_melk,p.tozih,p.jahat].join(' ').toLowerCase().includes(q);
    return mf && ms;
  });
}

function setFilter(el, val) {
  document.querySelectorAll('#chips .chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  activeFlt = val;
  renderCards(filterProps());
}

function filterCards() { renderCards(filterProps()); }

// ── HELPERS ──────────────────────────────────────────────
function gradCls(type) {
  if (type === 'آپارتمان') return 'grad-apt';
  if (type === 'ویلا')     return 'grad-vila';
  if (type === 'زمین')     return 'grad-land';
  return 'grad-com';
}

function fmtP(val) {
  if (!val) return '—';
  const n = parseInt(String(val).replace(/[,،]/g, ''), 10);
  if (isNaN(n)) return String(val);
  if (n >= 1_000_000_000) return (n / 1_000_000_000).toFixed(1).replace(/\.0$/, '') + ' م.ت';
  if (n >= 1_000_000)     return (n / 1_000_000).toFixed(0) + ' میلیون';
  return String(val);
}

function loc(addr) {
  if (!addr) return '';
  return addr.split('.').slice(1, 3).join(' · ');
}

// ── RENDER CARDS ─────────────────────────────────────────
function renderCards(list) {

    const isSale = p.type_moameleh === 'فروش';
    const isHot  = p.lead_score === 'hot';
    const l = loc(p.addr);

    const p2 = fmtP(p.price2);
    const hasAmen = p.asansor || p.parking || p.anbari;
    return `
<div class="card" onclick="openDetail('${p.id}')">
  <div class="card-ph ${gradCls(p.type_melk)}">
    <div class="card-ph-logo">VANTA</div>
    <div class="card-ph-overlay">
      <span class="card-ph-id">${p.id}</span>
      <div class="card-badges">
        ${isHot ? '<span class="badge badge-hot">HOT</span>' : ''}
        <span class="badge ${isSale ? 'badge-sale' : 'badge-rent'}">${p.type_moameleh}</span>
      </div>
    </div>
  </div>
  <div class="card-body">
    <div class="card-title">${p.type_melk}${p.metraj ? ' · ' + p.metraj + ' م²' : ''}</div>
    ${l ? `<div class="card-loc">${l}</div>` : ''}
    <div class="card-specs">
      ${p.khab && p.khab !== '—'    ? `<div class="spec"><b>${p.khab}</b> خواب</div>` : ''}
      ${p.tabaqeh && p.tabaqeh !== '—' ? `<div class="spec">طبقه <b>${p.tabaqeh}</b></div>` : ''}
      ${p.sal_sakh                   ? `<div class="spec">ساخت <b>${p.sal_sakh}</b></div>` : ''}
      ${p.jahat && p.jahat !== '—'  ? `<div class="spec"><b>${p.jahat}</b></div>` : ''}
    </div>
    ${hasAmen ? `
    <div class="amenities">
      ${p.asansor ? `<span class="amen ${p.asansor==='دارد'?'yes':''}">آسانسور</span>` : ''}
      ${p.parking ? `<span class="amen ${p.parking==='دارد'?'yes':''}">پارکینگ</span>` : ''}
      ${p.anbari  ? `<span class="amen ${p.anbari==='دارد'?'yes':''}">انباری</span>` : ''}
    </div>` : ''}
    <div class="card-price-row">
      <div>
        <div class="price-main">${p1} ت${isSale ? '/م²' : ''}</div>

</div>`;
  }).join('');
}

}

function closeModal(e) {
  if (e.target === document.getElementById('modal')) {
    document.getElementById('modal').classList.remove('open');
    if (BaleApp) BaleApp.BackButton?.hide();
  }
}

function startChat() {
  document.getElementById('modal').classList.remove('open');
  if (BaleApp) BaleApp.openLink?.('https://ble.ir/' + BOT_USERNAME);
  else showToast('ربات @' + BOT_USERNAME + ' را در بله باز کنید');
}

// ── PIN SYSTEM ───────────────────────────────────────────
function checkPin(section) {
  const inp = document.getElementById(section + '-inp');
  const err = document.getElementById(section + '-err');
  const v = inp.value.trim();
  const ok = section === 'filing'
    ? (v === DEMO_PIN || v.startsWith(ADVISOR_PREFIX))
    : (v === DEMO_PIN || v === SUP_PIN);
  if (ok) {
    document.getElementById(section + '-lock').style.display = 'none';
    document.getElementById(section + '-content').style.display = 'block';
    if (section === 'filing') renderFiling();
    if (section === 'leads')  renderLeads();
    showToast('دسترسی تأیید شد');
  } else {
    inp.classList.add('err');
    err.textContent = 'کد اشتباه است';
    setTimeout(() => { inp.classList.remove('err'); err.textContent = ''; inp.value = ''; }, 2000);
  }
}

  <button class="chip" onclick="fltLeads(this,'warm')">گرم</button>
  <button class="chip" onclick="fltLeads(this,'cold')">سرد</button>
</div>
<div class="sec">لیست مشتریان</div>
<div id="leads-list"></div>`;
  renderLeadList('all');
  const dot = document.getElementById('hot-dot');
  dot.style.display = hot ? 'block' : 'none';
}

function fltLeads(el, val) {
  document.querySelectorAll('#leads-content .chips .chip').forEach(c => c.classList.remove('on'));
  el.classList.add('on');
  activeLeadFlt = val;
  renderLeadList(val);
}

function renderLeadList(f) {
  const list = LEADS.filter(l => f === 'all' || l.score === f);
  const el = document.getElementById('leads-list');
  if (!el) return;
  el.innerHTML = list.map(l => `
<div class="lead">
  <div class="lead-dot d-${l.score}"></div>
  <div class="lead-body">
    <div class="lead-name">${l.name}</div>
    <div class="lead-detail">${l.zone} · ${l.budget} · ${l.sum}</div>
  </div>
  <div class="lead-right">
    <div class="ls ls-${l.score}">${l.score === 'hot' ? 'داغ' : l.score === 'warm' ? 'گرم' : 'سرد'}</div>
    <div class="lead-time">${l.time}</div>
  </div>
</div>`).join('') || '<div class="empty"><div class="empty-txt">لیدی در این دسته نیست</div></div>';
}

    if (document.getElementById('modal').classList.contains('open')) {
      document.getElementById('modal').classList.remove('open');
      BaleApp.BackButton.hide();
    }
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
